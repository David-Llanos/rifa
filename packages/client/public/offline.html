<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 1.5rem;
        max-width: 40rem;
        overflow-wrap: anywhere;
      }
      [lang="es"] {
        display: none;
      }
      html.es [lang="en"] {
        display: none;
      }
      html.es [lang="es"] {
        display: block;
      }
      button {
        min-height: 44px;
        padding: 0 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <section lang="en">
        <h1>You are offline</h1>
        <p>This page is unavailable without a connection. Purchases require a connection.</p>
        <button type="button" onclick="location.reload()">Try again</button>
      </section>
      <section lang="es">
        <h1>Sin conexión</h1>
        <p>Esta página no está disponible sin conexión. Las compras requieren conexión.</p>
        <button type="button" onclick="location.reload()">Intentar de nuevo</button>
      </section>
    </main>
    <script>
      (function () {
        var m = document.cookie.match(/(?:^|; )locale=([^;]+)/);
        var l = m ? m[1] : navigator.language || "en";
        if (l.slice(0, 2) === "es") {
          document.documentElement.classList.add("es");
          document.documentElement.lang = "es";
          document.title = "Sin conexión";
        }
      })();
    </script>
  </body>
</html>
